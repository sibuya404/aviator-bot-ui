<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Aviator Bot UI</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;margin:20px}
      #logs{height:300px;overflow:auto;background:#111;color:#bfc;padding:10px}
      button{margin-right:8px}
    </style>
  </head>
  <body>
    <h1>Aviator Bot UI</h1>
    <div>
      <button id="startSim">Start Simulator</button>
      <button id="stopSim">Stop Simulator</button>
      <button id="start1xSim">Start 1xBet Adapter (simulate-only)</button>
      <button id="start1xLive">Start 1xBet Adapter (live - dry-run)</button>
      <button id="stop1x">Stop 1xBet Adapter</button>
    </div>

    <h3>Logs</h3>
    <div id="logs"></div>

    <h3>Live rounds</h3>
    <ul id="rounds"></ul>

    <script src="https://cdn.socket.io/4.7.1/socket.io.min.js"></script>
    <script>
      const socket = io();

      function log(msg){
        const d = document.getElementById('logs');
        const el = document.createElement('div');
        el.textContent = '['+ new Date().toLocaleTimeString() +'] ' + msg;
        d.appendChild(el);
        d.scrollTop = d.scrollHeight;
      }

      // wire buttons
      document.getElementById('startSim').onclick = () => fetch('/api/simulator/start', {method:'POST'}).then(()=>log('Requested simulator start'));
      document.getElementById('stopSim').onclick = () => fetch('/api/simulator/stop', {method:'POST'}).then(()=>log('Requested simulator stop'));
      document.getElementById('start1xSim').onclick = () => fetch('/api/adapter/1xbet/start', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({live:false,headful:true,dryRun:true})}).then(r=>r.json()).then(()=>log('Requested 1xBet adapter (simulate-only) start'));
      document.getElementById('start1xLive').onclick = () => fetch('/api/adapter/1xbet/start', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({live:true,headful:true,dryRun:true})}).then(r=>r.json()).then((j)=>log('Requested 1xBet adapter (live,dry-run) start: ' + JSON.stringify(j)));
      document.getElementById('stop1x').onclick = () => fetch('/api/adapter/1xbet/stop', {method:'POST'}).then(()=>log('Requested 1xBet adapter stop'));

      socket.on('connect', ()=> log('connected to server'));
      socket.on('roundUpcoming', (r)=>{
        const li = document.createElement('li');
        li.textContent = `Round ${r.id} upcoming (starts ${new Date(r.startAt).toLocaleTimeString()})`;
        document.getElementById('rounds').prepend(li);
      });
      socket.on('roundStart', (r)=> log('roundStart: ' + JSON.stringify(r)));
      socket.on('roundCrash', (r)=> log('roundCrash: ' + JSON.stringify(r)));
      socket.on('adapterLog', (d)=> log('adapter: ' + (d.msg||JSON.stringify(d))));
    </script>
  </body>
</html>
